<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuickCanvas popup fixture</title>
    <link rel="stylesheet" href="/extension/popup.css?v=0.6.0" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand-lockup"><img class="brand-mark" src="/extension/icons/icon128.png" alt="QuickCanvas" /><div><p class="eyebrow">QuickCanvas</p><h1>Learning control center</h1></div></div>
        <div class="pill connected">Live</div>
      </header>
      <nav class="tabs"><button class="tab is-active">Themes</button><button class="tab">Account</button></nav>
      <section class="popup-overview"><div class="popup-welcome"><div><p class="panel-kicker">Good afternoon</p><h2>Make Canvas yours.</h2></div><button class="dashboard-link">Open dashboard ↗</button></div></section>
      <section class="panel connection-panel">
        <div class="connection-summary"><span class="connection-note-icon">✓</span><div class="connection-summary-copy"><strong>School Canvas</strong><span>Connected and updating normally</span></div><label class="switch"><input type="checkbox" checked /><span class="visually-hidden">Dashboard enabled</span></label></div>
      </section>
      <section class="panel preset-panel">
        <div class="panel-header preset-panel-header"><h2>Current theme</h2><button class="text-action">Browse community</button></div>
        <div class="preset-grid">
          <button class="preset is-active" style="--preset-accent:#1f5f8b;--preset-bg:#f7f5f0;--preset-surface:#fff;--preset-text:#1f2a33"><span class="preset-preview"><span class="preset-preview-nav"><span></span><span></span><span></span></span><span class="preset-preview-card"></span></span><span class="preset-footer"><span class="preset-title">Quiet Study</span><span class="preset-subtitle">Warm canvas · academic blue</span><span class="preset-swatches"><span class="preset-swatch" style="background:#1f5f8b"></span><span class="preset-swatch" style="background:#fff"></span><span class="preset-swatch" style="background:#f7f5f0"></span></span></span><span class="preset-choice">✓</span></button>
          <button class="preset" style="--preset-accent:#b5633c;--preset-bg:#f5eadb;--preset-surface:#fffaf2;--preset-text:#3f3028"><span class="preset-preview"><span class="preset-preview-nav"><span></span><span></span><span></span></span><span class="preset-preview-card"></span></span><span class="preset-footer"><span class="preset-title">Warm Paper</span><span class="preset-subtitle">Soft cream · terracotta</span><span class="preset-swatches"><span class="preset-swatch" style="background:#b5633c"></span><span class="preset-swatch" style="background:#fffaf2"></span><span class="preset-swatch" style="background:#f5eadb"></span></span></span><span class="preset-choice">✓</span></button>
          <button class="preset" style="--preset-accent:#70b7d8;--preset-bg:#18232d;--preset-surface:#263643;--preset-text:#edf4f7"><span class="preset-preview"><span class="preset-preview-nav"><span></span><span></span><span></span></span><span class="preset-preview-card"></span></span><span class="preset-footer"><span class="preset-title">Night Focus</span><span class="preset-subtitle">Deep slate · cool blue</span><span class="preset-swatches"><span class="preset-swatch" style="background:#70b7d8"></span><span class="preset-swatch" style="background:#263643"></span><span class="preset-swatch" style="background:#18232d"></span></span></span><span class="preset-choice">✓</span></button>
        </div>
      </section>
      <section class="quick-controls"><h2>Quick controls</h2><div class="quick-control-grid"><button class="quick-control"><span class="quick-control-icon">◐</span><span><strong>Appearance</strong><small>Mode, color, type</small></span></button><button class="quick-control"><span class="quick-control-icon">⌁</span><span><strong>Reminders</strong><small>Due-date alerts</small></span></button><button class="quick-control"><span class="quick-control-icon">＋</span><span><strong>Custom theme</strong><small>Build your own</small></span></button><button class="quick-control"><span class="quick-control-icon">☁</span><span><strong>Cloud themes</strong><small>Synced designs</small></span></button></div></section>
      <footer class="popup-account-summary"><span class="quick-account-avatar">YS</span><div><strong>Yonathan</strong><span>Theme sync and profile</span></div><button>Manage</button></footer>
    </main>
  </body>
</html>
